<div class="campo">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {% if campo.widget_type == 'password' %}<div class="entrada">{{ campo }}<button type="button" class="ver-clave" aria-label="Mostrar contraseña" onclick="var i=this.previousElementSibling;var v=i.type==='password';i.type=v?'text':'password';this.setAttribute('aria-label',v?'Ocultar contraseña':'Mostrar contraseña')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>{% else %}{{ campo }}{% endif %}
  {{ campo.errors }}
  {% if campo.help_text %}<p class="ayuda">{{ campo.help_text }}</p>{% endif %}
</div>
