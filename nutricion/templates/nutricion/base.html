{% load static %}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{% block color_tema %}#F4F0E7{% endblock %}">
<title>{% block titulo %}MyFitnessPal{% endblock %} · MyFitnessPal</title>
<link rel="manifest" href="{% static 'nutricion/manifest.webmanifest' %}">
<link rel="icon" href="{% static 'nutricion/icono.svg' %}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{% static 'nutricion/icono.svg' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap">
<link rel="stylesheet" href="{% static 'nutricion/app.css' %}">
</head>
<body class="{% block clase_body %}{% endblock %}">
<main class="app{% if tabs %} con-tabs{% endif %}">
  {% if messages %}<div class="mensajes" role="status">{% for m in messages %}<p class="msg {{ m.tags }}">{{ m }}</p>{% endfor %}</div>{% endif %}
  {% block contenido %}{% endblock %}
</main>
{% if tabs %}
<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <a href="{% url 'diario' %}" {% if tabs == 'diario' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7.5h6"/></svg>Diario</a>
    <a href="{% url 'progreso' %}" {% if tabs == 'progreso' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 20h18M7 17v-5M11 17V7M15 17v-7M19 17v-4"/></svg>Progreso</a>
    <a href="{% url 'agregar' %}" {% if tabs == 'agregar' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Agregar</a>
    <a href="{% url 'privacidad' %}" {% if tabs == 'privacidad' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>Privacidad</a>
    <a href="{% url 'menu' %}" {% if tabs == 'menu' %}aria-current="page"{% endif %}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menú</a>
  </div>
</nav>
{% endif %}
</body>
</html>
